packages: []

allowBuilds:
  esbuild: true
  msw: false

# Security bumps for build-time transitives whose parents pin a vulnerable
# range. Scoped by version so only the affected releases are replaced.
overrides:
  postcss@<8.5.23: ^8.5.23
  nanoid@<3.3.18: ^3.3.18
  brace-expansion@<5.0.12: ^5.0.12
  source-map-js@<1.2.2: ^1.2.2
  baseline-browser-mapping@<2.11.0: ^2.11.0
  browserslist@<4.28.7: ^4.28.7
